name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npm test

      - name: AI-vs-expert calibration gate (MAE ≤ 0.25, agreement ≥ 70%)
        run: npm run calibration -- --gate

      - name: Typecheck & production build
        run: npm run build
